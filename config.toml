[paths]
input_images = "/Users/cmbreen/Documents/FDLTCC/FF_2024"
#"nontrained_data" # Directory where images are located, by camera
images_output = "predictions" # Directory where marked images should be stored
trainee_model = "/Users/cmbreen/Documents/FDLTCC/models/CO_and_WA_model.pth"
#"/Users/cmbreen/Documents/FDLTCC/models/trained_allyears/model.pth"
