# All paths are relative to the root of the repository. Use forward slashes as separators, they will work on Windows as well.
# Traversing up is supported. Use ".." in the path to go up a directory.


[paths]
input_images = "/Users/cmbreen/Documents/FDLTCC/FF_2024"
trainee_model = "/Users/cmbreen/Documents/FDLTCC/models/CO_and_WA_model.pth"
models_output = "models/trained_cam_FF_lr001_pat5_weighted" # Directory where trained models should be stored. "model.pth" will be the filename of the trained model.

[labeling]
subset_to_label = 10 # Label every N images

[training]
lr = 0.001 # Learning Rate ## make it even bigger to start? 
epochs = 200 # Epochs
aug = false # whether to augment the data or not 
device = "cpu" # Device to use, either "cuda" or "cpu".
batch_size = 8 # Batch size
show_dataset_plot = false # Show dataset plot
filter = false

# LSTM-specific settings
use_lstm = true # Whether to use LSTM model for sequence training
sequence_length = 2 # Number of consecutive frames to use in LSTM sequences
progressive_training = true # Use progressive training (LSTM first, then fine-tune CNN)
lstm_hidden_size = 256 # Hidden size for LSTM layer
lstm_num_layers = 1 # Number of LSTM layers
lstm_lr = 0.001 # Learning rate for LSTM components (used in progressive training)
cnn_lr = 0.00001 # Learning rate for CNN components during fine-tuning stage

# Progressive training settings
stage1_epochs = 100 # Number of epochs for Stage 1 (LSTM only) - will be calculated as percentage of total epochs if progressive_training = true
unfreeze_layers = "last_block" # Which CNN layers to unfreeze in Stage 2: "all", "last_block", or "final_layer"
